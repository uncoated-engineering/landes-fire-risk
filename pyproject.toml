[project]
name = "landes-fire-risk"
version = "0.1.0"
description = "Geospatial wildfire-risk map of the Landes de Gascogne from open data"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "duckdb>=1.1",
    "h3>=4.0",
    "folium>=0.17",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
